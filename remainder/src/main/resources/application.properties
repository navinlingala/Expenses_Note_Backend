# ===================================================================
# Active Profile (defaults to 'dev'; override with SPRING_PROFILES_ACTIVE=prod)
# ===================================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}
spring.application.name=remainder

# JPA Common Settings
spring.jpa.open-in-view=false
